# HTTP API 포트 (실서버 jar 와 같음)
server.port = 8090

# DB 접속 정보는 db.properties 에서 읽습니다 (DbConfig).
#  - jar 와 같은 폴더의 db.properties (또는 -Ddb.config=경로) 가 있으면 그것을 쓰고
#  - 없으면 jar 안(src/main/resources)의 db.properties, 환경변수 DB_URL / DB_USERNAME / DB_PASSWORD 가 있으면 환경변수

# ---- 로그 ----
logging.level.root=info
# 로그 파일: 실행한 폴더의 logs/jetwork.log. 10MB 마다 새 파일로 바꾸고(압축), 30일치·전체 1GB 까지만 남긴다.
# (예전에는 콘솔에만 찍혀서, 콘솔 출력을 파일로 돌려 실행하면 디스크가 찰 때까지 한 파일이 계속 커졌다)
logging.file.name=logs/jetwork.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# ---- 전체 로그 (처리 과정을 모두 남김, 기본 꺼짐) ----
# 켜면: HTTP 요청·응답 본문과 걸린 시간, 모든 SQL 과 넣은 값·결과 행 수·걸린 시간, commit/rollback,
#       커넥션 풀·소켓 프레임·중계(relay) 상세 로그. 카드번호는 가려서 남긴다.
# 같은 요청에서 나온 줄에는 같은 요청 번호(#n)가 붙는다.
# 로그 양이 많아지므로 문제를 볼 때만 켜고, 다 보면 다시 끈다.
# 켜는 방법 (셋 중 하나):
#   1) 아래 줄의 # 를 지우고 재시작
#   2) java -jar JetworkServer.jar --logging.level.jetwork-all=debug
#   3) java -Dlogging.level.jetwork-all=debug -jar JetworkServer.jar
logging.group.jetwork-all=jetwork.trace,com.jetwork,com.stech,co.kr
#logging.level.jetwork-all=debug
# HTTP 만: logging.level.jetwork.trace.http=debug   SQL 만: logging.level.jetwork.trace.sql=debug
logging.pattern.level=%5p %X{req}
